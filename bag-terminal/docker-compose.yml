# =============================================================================
# 挎包终端 Docker Compose 编排
# 网络模式: host (BLE 需要直接访问主机 BlueZ D-Bus)
# 权限: privileged (BLE HCI / I2C / GPIO / USB 串口访问)
# 挂载: 模型文件 / SQLite 数据 / 照片存储 / 日志 / 配置 / DBus
# =============================================================================
version: "3.8"

services:
  bag-terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: railway-bag-terminal:1.0.0
    container_name: bag-terminal
    restart: unless-stopped

    # host 网络: BLE (BlueZ D-Bus) 和 5G 模块需要直接主机网络访问
    network_mode: host

    # privileged 模式: BLE HCI / I2C (BQ25895 充电) / GPIO / USB 串口
    privileged: true

    # 环境变量 (覆盖 config.yaml 默认值)
    environment:
      - ENV=production
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - SAAS_API_URL=http://saas.local:8000/api/v1
      - SAAS_API_TIMEOUT=30
      - BLE_SCAN_DURATION=10
      - BLE_MAX_CONNECTIONS=4
      - BLE_RECONNECT_INTERVAL=5
      - BLE_HEARTBEAT_INTERVAL=10
      - MODEL_DIR=/app/models
      - DB_PATH=/app/data/bag_terminal.db
      - QDRANT_PATH=/app/data/qdrant
      - TUYA_ENABLED=false
      - MQTT_BROKER=mqtt://tuya-mqtt.local:1883
      # 数据安全隔离: HMAC 签名密钥 (导出包完整性校验)
      - BAG_EXPORT_HMAC_KEY=${BAG_EXPORT_HMAC_KEY:-railway-ar-glasses-default-key}

    # 卷挂载
    volumes:
      # 模型文件 (ONNX / GGUF, 不入镜像, 从 MinIO 下载)
      - ./models:/app/models:ro
      # 配置文件
      - ./config:/app/config:ro
      # SQLite 数据库持久化
      - bag-terminal-data:/app/data
      # 照片/视频存储 (SD 卡或外部存储)
      - bag-terminal-photos:/app/storage/photos
      # 导出包存储 (PC 通过 USB 下载)
      - bag-terminal-exports:/mnt/sdcard/bag-terminal/exports
      # 日志
      - bag-terminal-logs:/app/logs
      # D-Bus socket (BlueZ 通信)
      - /var/run/dbus:/var/run/dbus
      # 蓝牙配置
      - /etc/bluetooth:/etc/bluetooth:ro
      # 设备节点 (BLE HCI / I2C / USB 串口)
      - /dev:/dev
      # 系统时区
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # 设备权限
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/i2c-1:/dev/i2c-1
      - /dev/ttyUSB0:/dev/ttyUSB0
      # USB 串口调试通道 (CDC-ACM, PC 连接时枚举)
      - /dev/ttyACM0:/dev/ttyACM0

    # 日志限制
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

    # 资源限制 (CM4: 4GB RAM)
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3.0"
        reservations:
          memory: 1G
          cpus: "1.0"

volumes:
  bag-terminal-data:
    driver: local
  bag-terminal-photos:
    driver: local
  bag-terminal-exports:
    driver: local
  bag-terminal-logs:
    driver: local
